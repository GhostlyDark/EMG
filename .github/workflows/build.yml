name: EMG

on: [push, pull_request, workflow_dispatch]

jobs:
  Linux:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        image: ["emg-linux-x64"]
    steps:
      - uses: actions/checkout@v6
      - name: Install Packages
        run: |
          # fix for "error processing package grub-efi-amd64-signed"
          sudo apt-mark hold grub-common grub-efi-amd64-bin shim-signed
          sudo apt-get -qq update
          sudo apt-get -y upgrade
          sudo apt-get -y install build-essential cmake curl freeglut3-dev gcc git libfreetype-dev libgtk-3-dev libhidapi-dev libhidapi-hidraw0 libpng-dev libsamplerate0-dev libsdl2-dev libspeexdsp-dev libvulkan-dev make nasm ninja-build pkg-config unzip wget zlib1g-dev
      - name: Prepare Environment
        run: |
          echo "GIT_REVISION=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Build EMG (Linux x64)
        run: |
          chmod u+x compile.sh && ./compile.sh
      - name: Upload EMG (Linux x64)
        uses: actions/upload-artifact@v7
        with:
          name: emg-${{ env.GIT_REVISION }}-linux-x64
          path: |
            build/EMG
  Windows:
    runs-on: windows-2025-vs2026
    strategy:
      matrix:
        image: ["emg-win-x64"]
    steps:
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: git make mingw-w64-clang-x86_64-cmake mingw-w64-clang-x86_64-freetype mingw-w64-clang-x86_64-gcc mingw-w64-clang-x86_64-glew mingw-w64-clang-x86_64-hidapi mingw-w64-clang-x86_64-libpng mingw-w64-clang-x86_64-libsamplerate mingw-w64-clang-x86_64-libusb mingw-w64-clang-x86_64-nasm mingw-w64-clang-x86_64-ninja mingw-w64-clang-x86_64-rust mingw-w64-clang-x86_64-SDL2 mingw-w64-clang-x86_64-speex mingw-w64-clang-x86_64-vulkan-headers unzip
      - name: Prepare Environment
        run: |
          $env:revision = git rev-parse --short HEAD
          echo "GIT_REVISION=$env:revision" >> $env:GITHUB_ENV
        shell: pwsh
      - name: Build EMG (Windows x64)
        run: |
          ./compile.sh
        shell: msys2 {0}
      - name: Upload EMG (Windows x64)
        uses: actions/upload-artifact@v7
        with:
          name: emg-${{ env.GIT_REVISION }}-win-x64
          path: |
            build\EMG
